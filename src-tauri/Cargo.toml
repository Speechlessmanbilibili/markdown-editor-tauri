[package]
name = "markdown-editor-tauri"
version = "1.1.0"
description = "Markdown Editor Pro — Tauri 桌面版"
authors = ["Speechlessmanbilibili"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
